name: Release

# Publishes the ds-core release `vX.Y.Z` (repo split spec §5.1), run on the
# tag's own ref: tag.yml dispatches it after tagging, and a tag pushed by
# hand starts it too. It publishes
#
#   - images/ds-migrate, built from the tagged commit, tagged vX.Y.Z (and
#     image.yml's sha-<short sha>), signed and attested;
#   - the access files as release assets, each with a Sigstore bundle from
#     `cosign sign-blob` under this workflow at the tag,
#     https://github.com/Distant-Signal/ds-core/.github/workflows/release.yml@refs/tags/vX.Y.Z,
#     which the chart's sync-core.py verifies: db-grants.yaml,
#     postgres-grants.sql, postgres-roles.sql, postgres-roles-setup.sh,
#     redis-users.acl.tpl, render-redis-acl.py and the line catalogue
#     validator's site-credits.json (scripts/release.py assets), and
#     SHA256SUMS.
#
# The repository has immutable releases on: once published, a release's
# assets can't change and its tag can't move or be deleted (a tag ruleset
# protects refs/tags/v* too). So the release is created as a draft, every
# asset, bundle and SHA256SUMS is uploaded to it, and only then is it
# published. A run that fails before publishing can be rerun with
# workflow_dispatch on the tag (`gh workflow run release.yml --ref vX.Y.Z`):
# every step is idempotent and an unpublished draft is reused. A published
# release is never redone: fix forward with a patch release (vX.Y.Z+1).

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      labels: ${{ steps.labels.outputs.labels }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The tag is the workspace version
        id: plan
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          version="$(python3 scripts/release.py version)"
          [[ "${REF}" == "refs/tags/${version}" ]] || {
            echo "::error::run on the tag refs/tags/${version}, not ${REF}"
            exit 1
          }
          echo "version=${version}" >>"${GITHUB_OUTPUT}"

      - name: Checkout Distant-Signal/ci (the reusable workflows' commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Distant-Signal/ci
          ref: 4ffee4c03a4f18c5b45d065a04e389353e9d186a
          path: .ds-ci
          persist-credentials: false

      - name: The image's version labels
        id: labels
        run: python3 .ds-ci/scripts/release-order.py labels --github-output

  # On a tag ref, image.yml's metadata tags the image vX.Y.Z (type=ref,
  # event=tag) and sha-<short sha>.
  ds-migrate:
    needs: plan
    uses: Distant-Signal/ci/.github/workflows/image.yml@4ffee4c03a4f18c5b45d065a04e389353e9d186a # main
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      service: ds-migrate
      dockerfile: docker/ds-migrate.Dockerfile
      publish: true
      build-args: DS_PROJECT_URL=${{ github.server_url }}/${{ github.repository }}
      labels: ${{ fromJSON(needs.plan.outputs.labels)['ds-migrate'] }}
      record-digest: false

  # vX.Y.Z must name exactly the signed and attested digest: checked, and
  # made so with a carbon copy (`--prefer-index=false`) if the tag is
  # missing.
  ds-migrate-tag:
    needs: [plan, ds-migrate]
    runs-on: ubuntu-26.04
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ds-migrate ${{ needs.plan.outputs.version }} is the built digest
        env:
          IMAGE: ${{ needs.ds-migrate.outputs.image }}
          DIGEST: ${{ needs.ds-migrate.outputs.digest }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          format='{{json .Manifest.Digest}}'
          tagged="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format "${format}" 2>/dev/null | tr -d '"')" || tagged=""
          if [[ "${tagged}" != "${DIGEST}" ]]; then
            docker buildx imagetools create --prefer-index=false --tag "${IMAGE}:${VERSION}" "${IMAGE}@${DIGEST}"
            tagged="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format "${format}" | tr -d '"')"
          fi
          [[ "${tagged}" == "${DIGEST}" ]] || { echo "::error::${IMAGE}:${VERSION} is ${tagged}, not ${DIGEST}"; exit 1; }
          echo "${IMAGE}:${VERSION}@${DIGEST}" >>"${GITHUB_STEP_SUMMARY}"

  assets:
    needs: plan
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write # cosign's keyless signing
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # renovate: datasource=pypi depName=uv
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the pinned script tools
        run: uv sync --locked --group lint

      - name: The rendered grants match db-grants.yaml
        run: uv run --no-sync scripts/gen-db-grants.py check

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Collect and sign the assets
        run: |
          set -euo pipefail
          mkdir dist
          uv run --no-sync scripts/release.py assets --out dist
          for f in dist/*; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "${f}"
          done
          (cd dist && sha256sum -- * >SHA256SUMS)
          ls -l dist

      - name: Upload the assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  release:
    needs: [plan, ds-migrate, ds-migrate-tag, assets]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist/

      - name: Draft the release, attach every asset, then publish it
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          IMAGE: ${{ needs.ds-migrate.outputs.image }}
          DIGEST: ${{ needs.ds-migrate.outputs.digest }}
        run: |
          set -euo pipefail
          {
            python3 scripts/release.py notes
            echo
            echo "ds-migrate: \`${IMAGE}:${VERSION}@${DIGEST}\`"
          } >"${RUNNER_TEMP}/notes.md"
          expected="$(find dist -maxdepth 1 -type f | wc -l)"
          if draft="$(gh release view "${VERSION}" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "${draft}" != true ]]; then
              echo "::error::${VERSION} is already published (immutable): fix forward with a patch release"
              exit 1
            fi
            gh release edit "${VERSION}" --notes-file "${RUNNER_TEMP}/notes.md"
          else
            gh release create "${VERSION}" --draft --verify-tag --title "${VERSION}" \
              --notes-file "${RUNNER_TEMP}/notes.md"
          fi
          gh release upload "${VERSION}" dist/* --clobber
          attached="$(gh release view "${VERSION}" --json assets --jq '.assets | length')"
          [[ "${attached}" -eq "${expected}" ]] || {
            echo "::error::the draft has ${attached} assets, not ${expected}"
            exit 1
          }
          gh release edit "${VERSION}" --draft=false --latest
