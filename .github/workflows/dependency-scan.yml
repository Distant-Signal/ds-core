name: Dependency vulnerability scan

# OSV-Scanner over Cargo.lock and uv.lock (Distant-Signal/ci's reusable
# dependency-scan.yml, whose header explains the thresholds): a pull request
# or push fails only on a CRITICAL finding with a fix available, or an
# inconclusive scan; other HIGH/CRITICAL findings are warnings.
#
# No daily schedule here: its tracking issue needs Issues, which this
# repository has off (repo split spec §4.2). Every consumer's Cargo.lock
# holds ds-core's dependencies, so the landing repository's daily scan
# already covers them.

concurrency:
  group: dependency-scan-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-scan:
    uses: Distant-Signal/ci/.github/workflows/dependency-scan.yml@f405ba7d7d51df62ad597f8fc1e56070abafca64 # main
    permissions:
      contents: read
      checks: write
      issues: write
