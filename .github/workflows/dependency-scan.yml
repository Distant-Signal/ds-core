name: Dependency vulnerability scan

# OSV-Scanner over Cargo.lock and uv.lock (Distant-Signal/ci's reusable
# dependency-scan.yml, whose header explains the thresholds): a pull request
# or push fails only on a CRITICAL finding with a fix available, or an
# inconclusive scan; other HIGH/CRITICAL findings are warnings.
#
# No daily schedule here: its tracking issue needs Issues, which this
# repository has off (repo split spec §4.2). Distant-Signal/distant-signal's
# dependency-scan-all.yml scans this repository's main daily and keeps its
# tracking issue there (label dependency-vulnerability/ds-core).

concurrency:
  group: dependency-scan-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-scan:
    uses: Distant-Signal/ci/.github/workflows/dependency-scan.yml@4ffee4c03a4f18c5b45d065a04e389353e9d186a # main
    permissions:
      contents: read
      checks: write
      issues: write
