name: CI

# Lint, build and test the core crates, the migrations, the grants and the
# scripts. Runs on every pull request to main and every push to main.
#
# Most jobs call Distant-Signal/ci's reusable workflows (repo split spec
# §5.5), pinned by SHA; Renovate bumps the pins. Each of their checks shows
# as `<job> / <job inside the reusable workflow>`. What stays here is
# ds-core's own: the migration order check, the grants and crate-boundary
# checks, and a build of the ds-migrate image (published only by
# release.yml).

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # A run on demand: main's first commit was pushed while Actions was off,
  # and GitHub doesn't replay it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # clippy in both feature sets (-D warnings), the MSRV check (Cargo.toml's
  # rust-version), cargo-deny, rustfmt, and build and test (the tests that
  # need no database). The extra step is the fast, offline tier of the
  # lines/*.toml identifier validator, against reference-data/. Its live
  # tier is validate-line-catalogue.yml (disabled pending credentials).
  # No rdkafka here, so only native-tls's build packages.
  rust:
    uses: Distant-Signal/ci/.github/workflows/rust-ci.yml@d734bc69e3127d208304c9d6a5a04b9e5645fc76 # main
    with:
      toolchain: 1.88.0
      msrv: 1.88.0
      apt-packages: libssl-dev pkg-config
      extra-test-name: Validate lines/*.toml external identifiers (fast tier)
      extra-test-command: cargo run -p line-catalogue-validator

  actionlint:
    uses: FasterSpeeding/Piped/.github/workflows/lint-actions.yml@5bbddb5d32d5bde939b18f6c6bcfa0e36779412f # master @ 2026-09-01

  # The DATABASE_URL/REDIS_URL-gated `#[ignore]`d tests, built once into an
  # archive and run as passes (.github/db-tests.toml): as the superuser
  # (with the grants classification check), as the app role on an existing
  # and a new cluster, and as the per-service roles whose grants ds-store's
  # own suites exercise. The images are the chart's.
  rust-db-tests:
    uses: Distant-Signal/ci/.github/workflows/rust-db-tests.yml@d734bc69e3127d208304c9d6a5a04b9e5645fc76 # main
    with:
      toolchain: 1.88.0
      # renovate: datasource=docker depName=postgres
      postgres-image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
      # renovate: datasource=docker depName=valkey/valkey
      redis-image: valkey/valkey:8.1.10-trixie@sha256:640c5e62cea04b6d6f2084232651d0cc70362d31f4f805e7be94dbed6855e8f2

  # One check name to wait on: green only when every DB pass passed.
  rust-db-test:
    name: cargo test -- --ignored (DB/Redis-backed)
    if: ${{ always() }}
    needs: [rust-db-tests]
    runs-on: ubuntu-26.04
    steps:
      - name: Every DB test job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: ${RESULTS}"
          for result in ${RESULTS}; do
            [[ "${result}" == success ]] || exit 1
          done

  migration-order:
    name: migration versions are newer than the base
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # renovate: datasource=pypi depName=uv
          version: "0.13.6"
          enable-cache: false

      - name: Check migration order
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" = "pull_request" ]]; then
            base="$(git merge-base "origin/${BASE_REF}" HEAD)"
          elif [[ -n "${BEFORE}" ]] && [[ "${BEFORE}" != "0000000000000000000000000000000000000000" ]] \
              && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="${BEFORE}"
          else
            echo "no usable base commit (new branch or force push); skipping"
            exit 0
          fi
          uv run --locked --no-default-groups scripts/check-migration-order.py "${base}"

  commit-identity:
    uses: Distant-Signal/ci/.github/workflows/identity.yml@d734bc69e3127d208304c9d6a5a04b9e5645fc76 # main

  licence:
    uses: Distant-Signal/ci/.github/workflows/licence.yml@d734bc69e3127d208304c9d6a5a04b9e5645fc76 # main

  # shellcheck, shfmt, ruff, mypy --strict, actionlint and hadolint over this
  # repository, then scripts/tests and the ignored-benchmark gate.
  scripts-lint:
    uses: Distant-Signal/ci/.github/workflows/scripts-lint.yml@d734bc69e3127d208304c9d6a5a04b9e5645fc76 # main
    with:
      check-bench-gates: true

  # The grants render (access/postgres-grants.sql is what db-grants.yaml
  # renders to; the classification check against a migrated database runs
  # in the superuser DB pass), the release notes, and ds-store's and
  # ds-migrate's dependency boundary (`cargo tree` only).
  core-checks:
    name: core checks (grants render, crate deps)
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # renovate: datasource=pypi depName=uv
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the pinned script tools
        run: uv sync --locked --group lint

      - name: access/postgres-grants.sql is what db-grants.yaml renders to
        run: uv run --no-sync scripts/gen-db-grants.py check

      - name: Release notes and version are consistent
        run: uv run --no-sync scripts/release.py check

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.88.0

      - name: ds-store and ds-migrate dependency boundary
        run: uv run --no-sync scripts/check-crate-deps.py

  # The ds-migrate image's labels (org.distant-signal.core-version: this
  # checkout's workspace version), for the image build below.
  image-labels:
    name: image labels
    runs-on: ubuntu-26.04
    outputs:
      labels: ${{ steps.labels.outputs.labels }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout Distant-Signal/ci (the reusable workflows' commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Distant-Signal/ci
          ref: d734bc69e3127d208304c9d6a5a04b9e5645fc76
          path: .ds-ci
          persist-credentials: false

      - name: The image's version labels
        id: labels
        run: python3 .ds-ci/scripts/release-order.py labels --github-output

  # Builds the ds-migrate image without publishing it, so a Dockerfile or
  # dependency change that breaks it fails here and not in a release.
  ds-migrate-image:
    needs: image-labels
    uses: Distant-Signal/ci/.github/workflows/image.yml@d734bc69e3127d208304c9d6a5a04b9e5645fc76 # main
    # image.yml's job asks for these; with publish false it pushes nothing.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      service: ds-migrate
      dockerfile: docker/ds-migrate.Dockerfile
      publish: false
      build-args: DS_PROJECT_URL=${{ github.server_url }}/${{ github.repository }}
      labels: ${{ fromJSON(needs.image-labels.outputs.labels)['ds-migrate'] }}
