# The DB test passes: ci.yml's `rust-db-tests` job runs Distant-Signal/ci's
# reusable rust-db-tests.yml, which reads this file (format: that
# repository's scripts/db-tests-passes.py).
#
# The DATABASE_URL/REDIS_URL-gated `#[ignore]`d tests of the core crates:
# ds-store, ds-migrate, ds-runtime's pool settings, and the Redis ACL and
# stream suites (common, ingest-stream). The archive step builds every test
# binary once into a cargo-nextest archive (scripts/db-tests.py holds the
# package list and every pass's steps), and one job per [[pass]] runs from
# it, each against its own Postgres and Redis.
#
# Every script runs with bash -euo pipefail from the repository root, with
# DATABASE_URL (the superuser), REDIS_URL, DB_TESTS_ARCHIVE, sqlx-cli,
# cargo-nextest and `uv sync --locked --group lint`.

[archive]
run = '''
uv run --locked --no-default-groups scripts/db-tests.py archive --archive-file "${DB_TESTS_ARCHIVE}"
'''

# The superuser pass on the migrated `postgres` database: ds-store's suites
# (the #[sqlx::test] modules run only here), ds-migrate's `run`, the pool
# settings, and the Redis ACL and stream suites.
#
# Every table, view, sequence and function the migrations create must be
# classified in crates/ds-store/db-grants.yaml (a new table without a
# classification fails here, not in production), and
# access/postgres-grants.sql must be what that file renders to.
[[pass]]
id = "superuser"
name = "DB tests as the superuser (+ Redis)"
run = '''
echo "== Run the migrations (crates/ds-store/migrations)"
(cd crates/ds-store && sqlx migrate run)

echo "== every public table, view and sequence is classified (db-grants.yaml)"
uv run --no-sync scripts/gen-db-grants.py check --database-url "${DATABASE_URL}"

echo "== DB/Redis-backed tests as the superuser (scripts/db-tests.py run superuser)"
uv run --no-sync scripts/db-tests.py run superuser --archive-file "${DB_TESTS_ARCHIVE}" --extract-to "${GITHUB_WORKSPACE}"
'''

# The Postgres role split (the landing repository's
# docs/postgres-app-role.md): scripts/test-postgres-roles.py makes a fresh
# database and roles with access/postgres-roles.sql (the script the chart's
# roles Job runs), then runs ds-store's suites with DATABASE_URL and
# MIGRATION_DATABASE_URL as the schema owner (the shared app role was dropped
# in release E; each service's own role is the per-service pass below).
# `existing` converts a database migrated as the superuser, and recreates the
# retired app role as the old script left it to prove the setup script drops it
# (and refuses while it has a session or owns an object); `new` creates the
# roles first and migrates as the owner. --check-setup-job runs the setup
# through the Job's entrypoint (access/postgres-roles-setup.sh) behind a
# reader holding ACCESS SHARE on every table, with lock_timeout=2s.
[[pass]]
id = "role-split"
name = "DB tests as the schema owner (existing and new cluster)"
run = '''
echo "== DB-backed tests as the non-superuser owner role (existing cluster)"
uv run --no-sync scripts/test-postgres-roles.py --mode existing --check-app-retirement --check-setup-job -- \
  uv run --no-sync scripts/db-tests.py run existing --archive-file "${DB_TESTS_ARCHIVE}" --extract-to "${GITHUB_WORKSPACE}"

echo "== DB-backed tests as the non-superuser owner role (new cluster)"
uv run --no-sync scripts/test-postgres-roles.py --mode new -- \
  uv run --no-sync scripts/db-tests.py run new --archive-file "${DB_TESTS_ARCHIVE}" --extract-to "${GITHUB_WORKSPACE}"
'''

# ds-store's suites as the per-service roles of access/postgres-grants.sql
# whose grants they exercise: the api's (most of them, since ingest plan 1A
# moved the api's data access here), schedule_reference's (the publish
# protocol and its run signals), and release D's narrowed api role. Each
# service's own suites run in its own repository, against this
# repository's grants at its pinned core version.
[[pass]]
id = "per-service"
name = "DB tests as each service's role (Stage 0b, release D)"
run = '''
echo "== ds-store's suites as the service roles (Stage 0b)"
uv run --no-sync scripts/test-postgres-roles.py --mode per-service --check-setup-job --observe api,aggregator,enricher,notifier -- \
  uv run --no-sync scripts/db-tests.py run per-service --archive-file "${DB_TESTS_ARCHIVE}" --extract-to "${GITHUB_WORKSPACE}"

echo "== Release D's narrowed api role"
uv run --no-sync scripts/test-postgres-roles.py --mode per-service --narrow api,aggregator,enricher,notifier -- \
  uv run --no-sync scripts/db-tests.py run narrow --archive-file "${DB_TESTS_ARCHIVE}" --extract-to "${GITHUB_WORKSPACE}"
'''
