[package]
name = "ds-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# The domain-free half of what was `common` (repo-split spec §5.8): startup
# and retry, logging, metrics, service arguments, secrets, the Redis and
# Postgres connection settings and the outbound User-Agent. It knows nothing
# about rail; `common` (the domain) depends on it.

[dependencies]
anyhow = "1.0.102"
# `logging`'s JSON line timestamps.
chrono = "0.4.44"
clap = { version = "4.6.6", features = ["derive", "env"] }
metrics = "0.24"
# The listener (`http-listener`, hence hyper) only with the `http` feature;
# without it the crate still builds recorders (tests, `ds-store`).
metrics-exporter-prometheus = { version = "0.18", default-features = false }
# Only with the `postgres` feature: `ds_runtime::pg`, the pool settings
# shared by the crates that hold a Postgres pool.
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio"], optional = true }
# Only with the `redis` feature: `ds_runtime::redis_conn`, the bounded
# ConnectionManager settings shared by every worker that holds a Redis
# connection, and `redis_group`.
redis = { version = "1.8", features = ["tokio-comp", "connection-manager"], optional = true }
# Only with the `http` feature (on by default): `outbound_endpoint_guard`.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form", "native-tls", "gzip"], optional = true }
serde = "1.0.228"
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time", "net"] }
tracing = "0.1.44"
# `ds_runtime::logging`: the one subscriber setup every binary shares.
# `json` for the span-field storage (`JsonFields`) behind the JSON line format.
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5"

# `ds_runtime::heap`: `mallopt` and `malloc_trim`, glibc only. Already in the
# tree via tokio/std.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"

[features]
# Every service uses the defaults. `ds-store` turns them off (through
# `common`): its normal dependency closure must not contain hyper or reqwest
# (scripts/check-crate-deps.py, ingest architecture spec §5.1).
default = ["http"]
# `outbound_endpoint_guard` (reqwest) and the metrics HTTP listener
# (`metrics::install`, hyper via `http-listener`).
http = ["dep:reqwest", "metrics-exporter-prometheus/http-listener"]
# `ds_runtime::pg` (Postgres pool settings).
postgres = ["dep:sqlx"]
# `ds_runtime::redis_conn` and `redis_group` (bounded Redis connection
# settings, consumer-group helpers).
redis = ["dep:redis"]
# `ds_runtime::redis_group::fake::FakeConn`, a scripted Redis connection for
# other crates' unit tests (movement-feed, enricher). Test-only.
redis-test-util = ["redis"]

[dev-dependencies]
# `logging`'s test of `log`-crate events (both already in the workspace via
# tracing-subscriber's default `tracing-log` feature).
log = "0.4"
tracing-log = "0.2"
# Only to prove `redis_auth` URLs parse back to the same credentials in the
# redis crate the services use (already in the workspace; no new crate).
redis = { version = "1.8", default-features = false }
tokio = { version = "1.52.3", features = ["test-util", "io-util"] }

[lints]
workspace = true
