[package]
name = "common"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
chrono-tz = "0.10"
# The domain-free runtime (backoff, logging, metrics, service args, ...),
# split out of this crate (repo-split spec §5.8). Its features follow this
# crate's: `ds-store` turns the defaults off here and so there.
ds-runtime = { path = "../ds-runtime", default-features = false }
glob = "0.3.3"
metrics = "0.24"
# Only with the `postgres` feature: `common::public_delay::db` (hence
# `chrono` and `derive`). Same version and features the workspace already uses.
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio", "chrono", "derive"], optional = true }
# Only with the `redis` feature: `common::incident_text_changed`. Same
# version and features those crates already use.
redis = { version = "1.8", features = ["tokio-comp", "connection-manager"], optional = true }
# Only with the `http` feature (on by default): see [features].
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form", "native-tls", "gzip"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde-inline-default = "1.0.1"
serde_json = "1.0.149"
serde_repr = "0.1.20"
sha2 = "0.10"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time", "net"] }
# Only with the `ts` feature: see [features].
# Only with the `ts` feature: the OpenAPI schemas, next to ts-rs.
schemars = { version = "1.2.3", default-features = false, features = ["derive", "std", "chrono04"], optional = true }
ts-rs = { version = "=12.0.1", default-features = false, features = ["serde-compat", "chrono-impl", "serde-json-impl"], optional = true }
toml = { version = "1.1.2", features = ["serde"] }
tracing = "0.1.44"
url = "2.5"

[features]
# Every service uses the defaults. `ds-store` turns them off: its normal
# dependency closure must not contain hyper or reqwest
# (scripts/check-crate-deps.py, ingest architecture spec §5.1).
default = ["http"]
# Outbound HTTP (reqwest: `ingest`, `poller_loop`,
# `gcp_external_account`) and, through `ds-runtime/http`, the metrics HTTP
# listener `poller_loop` installs.
http = ["dep:reqwest", "ds-runtime/http"]
# `common::public_delay::db` (sqlx). The pollers and consumers do not build
# sqlx.
postgres = ["dep:sqlx"]
# `common::incident_text_changed` (over `ds_runtime::redis_conn`).
redis = ["dep:redis", "ds-runtime/redis"]
# `ts_rs::TS` on the domain types the api sends the frontend, for its
# generated TypeScript (`api::api_types`, repo-split spec §5.3). Enabled by
# the api only.
ts = ["dep:ts-rs", "dep:schemars"]

[dev-dependencies]
# `poller_loop`'s and `gcp_external_account`'s metric tests build a
# recorder (no listener).
metrics-exporter-prometheus = { version = "0.18", default-features = false }
# tests/redis_acl.rs drives a real Redis as each ACL user (already in the
# workspace; no new crate).
redis = { version = "1.8", default-features = false }
# `gcp_external_account`'s subject-token files (already in the workspace,
# same spec as schedule-ingest's).
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1.52.3", features = ["test-util", "io-util"] }

[lints]
workspace = true
